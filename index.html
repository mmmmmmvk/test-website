<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parametric Design</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000000;
      overflow: hidden;
      color: white;
      font-family: 'Montserrat', sans-serif;
    }
    #inputContainer {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }

    #clearButton, #micButton {
      margin-left: 10px;
      padding: 6px 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #micButton {
      background-color: #333;
      color: white;
      border: 1px solid #666;
      border-radius: 4px;
    }

    #micButton.listening {
      background-color: #ff4444;
      border-color: #ff6666;
    }

    input, select {
      font-size: 18px;
      padding: 4px 8px;
      margin-right: 5px;
    }

    select {
      background-color: #333;
      color: white;
      border: 1px solid #666;
      border-radius: 4px;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }

    #transcript {
      margin-top: 8px;
      max-width: min(700px, 90vw);
      font-size: 18px;
    }

    #controls {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    #colorControls {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    #colorSlider {
      width: 200px;
      margin: 0 10px;
      height: 8px;
      background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    #colorSlider::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: white;
      border: 2px solid #333;
      border-radius: 50%;
      cursor: pointer;
    }

    #colorSlider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: white;
      border: 2px solid #333;
      border-radius: 50%;
      cursor: pointer;
    }

    #colorLabel {
      color: #ccc;
      font-size: 14px;
      min-width: 80px;
    }

    #shortcuts {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
<div id="inputContainer">
    <div id="controls">
        <input type="text" id="textInput" placeholder="input text..." />
        <select id="languageSelect">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="de-DE" selected>German</option>
            <option value="it-IT">Italian</option>
            <option value="ru-RU">Russian</option>
            <option value="zh-CN">Chinese</option>
            <option value="ja-JP">Japanese</option>
            <option value="ko-KR">Korean</option>
            <option value="pt-BR">Portuguese (Brazil)</option>
            <option value="ar-SA">Arabic</option>
        </select>
        <button id="clearButton">Clear</button>
        <button id="micButton">Start Listening</button>
    </div>
    <div id="colorControls">
        <label id="colorLabel">Color:</label>
        <input type="range" id="colorSlider" min="0" max="360" value="50" />
    </div>
    <div id="shortcuts">Press 'C' to clear | Enter to add text</div>
    <div id="status"></div>
    <div id="transcript" aria-label="Recognized speech"></div>
</div>

<script>
  let particles = [];
  let pixelSize = 2;
  let cols, rows;
  let grid = [];
  let recognition;
  let isListening = false;
  let continuousListening = false;
  let speechRenderQueue = [];
  let textGraphicsBuffer;
  const glyphCache = new Map();

  // Track occurrences, not unique spellings. Keep unchanged prefix/suffix
  // groups when the service revises an interim phrase.
  class SpeechWords {
    constructor(add, remove) {
      this.add = add;
      this.remove = remove;
      this.reset();
    }
    reset() {
      this.pending = new Map();
      this.finalThrough = -1;
      this.segmenter = null;
    }
    tokenize(text, language) {
      if (typeof Intl.Segmenter === 'function') {
        if (!this.segmenter || this.language !== language) {
          this.language = language;
          this.segmenter = new Intl.Segmenter(language, { granularity: 'word' });
        }
        return Array.from(this.segmenter.segment(text))
          .filter(part => part.isWordLike).map(part => part.segment);
      }
      return text.trim().split(/\s+/).filter(Boolean);
    }
    update(event, language) {
      for (const [index, groups] of this.pending) {
        if (index >= event.results.length) {
          groups.forEach(this.remove);
          this.pending.delete(index);
        }
      }
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (i <= this.finalThrough) continue;
        const result = event.results[i];
        const words = this.tokenize(result[0].transcript, language);
        const old = this.pending.get(i) || [];
        const key = word => word.normalize('NFC').toLocaleLowerCase(language);
        let prefix = 0, suffix = 0;
        while (prefix < old.length && prefix < words.length &&
          key(old[prefix].text) === key(words[prefix])) prefix++;
        while (suffix < old.length - prefix && suffix < words.length - prefix &&
          key(old[old.length - 1 - suffix].text) === key(words[words.length - 1 - suffix])) suffix++;
        const groups = old.slice(0, prefix);
        old.slice(prefix, old.length - suffix).forEach(this.remove);
        for (let w = prefix; w < words.length - suffix; w++) {
          const group = { text: words[w], active: true };
          groups.push(group);
          this.add(group);
        }
        if (suffix) groups.push(...old.slice(old.length - suffix));
        if (result.isFinal) {
          this.finalThrough = i;
          this.pending.delete(i);
        } else {
          this.pending.set(i, groups);
        }
      }
    }
  }
  let currentHue = 50; // Default hue value

  function setup() {
    createCanvas(windowWidth, windowHeight);
    colorMode(HSB, 360, 100, 100, 255); // Use HSB for hue control
    
    // Disable pixel density scaling to ensure consistent behavior
    pixelDensity(1);
    
    // Use system font that supports multiple languages
    textFont('Montserrat, Arial, sans-serif');
    
    cols = floor(width / pixelSize);
    rows = floor(height / pixelSize);
    grid = Array.from({ length: cols }, () => Array(rows).fill(null));

    for (let i = 0; i < 200; i++) {
      let gridX = floor(random(cols));
      let gridY = floor(random(-50, -10));
      let px = gridX * pixelSize;
      let py = gridY * pixelSize;
      particles.push(new Particle(px, py));
    }

    const input = document.getElementById('textInput');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        createTextParticles(input.value);
        input.value = '';
      }
    });

    const button = document.getElementById('clearButton');
    button.addEventListener('click', clearParticles);

    // Add color slider event listener
    const colorSlider = document.getElementById('colorSlider');
    colorSlider.addEventListener('input', (e) => {
      currentHue = parseInt(e.target.value);
    });

    // Initialize speech recognition
    initSpeechRecognition();
    if (document.fonts) document.fonts.ready.then(() => glyphCache.clear());
  }

  // Extract clear function for reusability
  function clearParticles() {
    particles = [];
    speechRenderQueue = [];
    grid = Array.from({ length: cols }, () => Array(rows).fill(null));
  }

  // Add p5.js keyPressed function for keyboard shortcuts
  function keyPressed() {
    // Check if 'c' or 'C' is pressed and the text input is not focused
    if ((key === 'c' || key === 'C') && document.activeElement !== document.getElementById('textInput')) {
      clearParticles();
    }
  }

  function initSpeechRecognition() {
    const micButton = document.getElementById('micButton');
    const status = document.getElementById('status');
    const languageSelect = document.getElementById('languageSelect');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');

    if (!SpeechRecognition) {
      micButton.disabled = true;
      micButton.textContent = 'Not Supported';
      status.textContent = 'Speech recognition is unavailable in this browser. You can still type text.';
      return;
    }
    if (window.isSecureContext === false) {
      micButton.disabled = true;
      status.textContent = 'Open this page over HTTPS or localhost to use the microphone.';
      return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    // User intent is separate from the browser session state.
    let state = 'idle';
    let restartTimer = null;
    let retryCount = 0;
    let sessionStartedAt = 0;
    let sessionError = '';
    let languageChangePending = false;
    const maxRetries = 4;
    const speechWords = new SpeechWords(
      group => speechRenderQueue.push(group),
      group => { group.active = false; }
    );

    function cancelRestart() {
      clearTimeout(restartTimer);
      restartTimer = null;
    }

    function showButton() {
      micButton.textContent = continuousListening ? 'Stop Listening' : 'Start Listening';
      micButton.classList.toggle('listening', continuousListening);
      micButton.setAttribute('aria-pressed', String(continuousListening));
      micButton.disabled = state === 'stopping';
    }

    function fail(message) {
      continuousListening = false;
      cancelRestart();
      status.textContent = message;
      showButton();
    }

    function errorMessage(code) {
      const messages = {
        'not-allowed': 'Microphone access was denied. Allow microphone access in your browser and system settings, then try again.',
        'service-not-allowed': 'The browser blocked the speech recognition service. Check browser settings or try another supported browser.',
        'audio-capture': 'No microphone audio is available. Check the selected microphone and system permissions, then try again.',
        'network': 'The speech recognition service could not be reached. Check your connection and try again.',
        'language-not-supported': 'The selected language is not supported by this speech recognition service.',
        'aborted': 'Speech recognition was interrupted. Please try again.'
      };
      return messages[code] || `Speech recognition failed (${code}). Please try again.`;
    }

    function startSession() {
      cancelRestart();
      if (!continuousListening || state !== 'idle') return;
      state = 'starting';
      sessionError = '';
      sessionStartedAt = Date.now();
      languageChangePending = false;
      speechWords.reset();
      recognition.lang = languageSelect.value;
      status.textContent = 'Starting microphone... Allow access if prompted.';
      showButton();
      try {
        recognition.start();
      } catch (error) {
        state = 'idle';
        isListening = false;
        console.error('Speech recognition start failed:', error);
        fail(`Could not start speech recognition (${error.name}). Please try again.`);
      }
    }

    function stopSession() {
      if (state !== 'starting' && state !== 'listening') return;
      state = 'stopping';
      showButton();
      // abort also works while the browser is still starting the session.
      // Wait for onend before allowing another start.
      recognition.abort();
    }

    languageSelect.addEventListener('change', () => {
      if (!continuousListening) return;
      languageChangePending = true;
      cancelRestart();
      if (state === 'idle') startSession();
      else stopSession();
    });

    recognition.onstart = () => {
      if (!continuousListening || state === 'stopping') {
        if (state !== 'stopping') stopSession();
        return;
      }
      state = 'listening';
      isListening = true;
      showButton();
      status.textContent = `Listening in ${languageSelect.options[languageSelect.selectedIndex].text}... Speak now!`;
    };

    recognition.onresult = (event) => {
      if (!continuousListening || languageChangePending) return;
      retryCount = 0;
      speechWords.update(event, recognition.lang);
      // Display the latest phrase immediately. No delayed clearing that could
      // erase a newer update or interrupt manual text input.
      const latest = event.results[event.results.length - 1];
      const transcript = latest ? latest[0].transcript.trim() : '';
      document.getElementById('transcript').textContent = transcript;
    };

    recognition.onerror = (event) => {
      sessionError = event.error;
      console.error('Speech recognition error:', event.error, event.message || '');
      if (!continuousListening) return;
      if (event.error === 'aborted' && languageChangePending) return;
      // Retry temporary failures only after onend, never from this handler.
      if (['no-speech', 'aborted', 'audio-capture', 'network'].includes(event.error)) {
        status.textContent = event.error === 'no-speech'
          ? 'No speech detected. Listening will resume...'
          : `${errorMessage(event.error)} Reconnecting...`;
      } else {
        fail(errorMessage(event.error));
      }
    };

    recognition.onend = () => {
      state = 'idle';
      isListening = false;
      showButton();
      if (!continuousListening) return;

      const changingLanguage = languageChangePending;
      const transientFailure = ['aborted', 'audio-capture', 'network'].includes(sessionError);
      const endedQuickly = Date.now() - sessionStartedAt < 5000;
      if (changingLanguage) retryCount = 0;
      else if (transientFailure || endedQuickly) retryCount++;
      else retryCount = 0;

      if (retryCount > maxRetries) {
        fail(sessionError && sessionError !== 'no-speech'
          ? errorMessage(sessionError)
          : 'The browser keeps ending speech recognition. Check microphone access and try again.');
        return;
      }

      status.textContent = changingLanguage
        ? 'Switching language...'
        : 'Reconnecting microphone...';
      cancelRestart();
      const delay = changingLanguage ? 250 : Math.min(500 * 2 ** retryCount, 8000);
      restartTimer = setTimeout(startSession, delay);
    };

    micButton.addEventListener('click', () => {
      if (continuousListening) {
        continuousListening = false;
        cancelRestart();
        status.textContent = 'Listening stopped.';
        stopSession();
        showButton();
      } else if (state === 'idle') {
        continuousListening = true;
        retryCount = 0;
        startSession();
      }
    });
    showButton();
  }

  function draw() {
    background(0, 8);

    // Remove superseded hypotheses before rendering their replacements.
    particles = particles.filter(p => !p.speechGroup || p.speechGroup.active);
    speechRenderQueue = speechRenderQueue.filter(group => group.active);
    // Spread a burst over frames instead of blocking the recognition callback.
    for (let count = 0; count < 3 && speechRenderQueue.length; count++) {
      const group = speechRenderQueue.shift();
      createTextParticles(group.text, group);
    }

    // Clear grid
    for (let x = 0; x < cols; x++) {
      for (let y = 0; y < rows; y++) {
        grid[x][y] = null;
      }
    }

    // Place particles in grid
    for (let p of particles) {
      let gx = floor(p.x / pixelSize);
      let gy = floor(p.y / pixelSize);
      if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
        grid[gx][gy] = p;
      }
    }

    // Update and display
    for (let p of particles) p.update();
    for (let p of particles) p.display();

    // Cleanup
    for (let i = particles.length - 1; i >= 0; i--) {
      if (particles[i].y > height + 50) {
        particles.splice(i, 1);
      }
    }

    if (random(100) < 4) {
      let gridX = floor(random(cols));
      let px = gridX * pixelSize;
      particles.push(new Particle(px, -pixelSize));
    }
  }

class Particle {
  constructor(x, y) {
    this.x = floor(x / pixelSize) * pixelSize;
    this.y = floor(y / pixelSize) * pixelSize;
    this.alpha = 150;
    this.brightness = random(90, 100);  // variation in brightness
    this.hue = currentHue + random(-10, 10); // Use current hue with slight variation
  }

  update() {
    let gx = floor(this.x / pixelSize);
    let gy = floor(this.y / pixelSize);

    // Guard: skip update if out of bounds
    if (
      gx < 0 || gx >= cols ||
      gy < 0 || gy >= rows
    ) return;

    if (gy < rows - 1) {
      if (!grid[gx][gy + 1]) {
        this.y += pixelSize;
      } else {
        let dirs = [-1, 1];
        for (let d of dirs.sort(() => random() - 0.5)) {
          let nx = gx + d;
          if (nx >= 0 && nx < cols && !grid[nx][gy + 1]) {
            this.x = nx * pixelSize;
            this.y += pixelSize;
            break;
          }
        }
      }
    }
  }

  display() {
    fill(this.hue, 100, this.brightness, this.alpha);
    noStroke();
    rect(this.x, this.y, pixelSize, pixelSize);
  }
}

  function createTextParticles(text, speechGroup = null) {
    if (!text) return;
    
    try {
      // Reuse one canvas and cache sampled word shapes to avoid repeated
      // canvas allocation and pixel readback for common words.
      if (!textGraphicsBuffer) {
        textGraphicsBuffer = createGraphics(800, 200);
        textGraphicsBuffer.pixelDensity(1);
      }
      const textGraphics = textGraphicsBuffer;
      const x = 400;
      const y = 100;
      let offsets = glyphCache.get(text);
      if (!offsets) {
        textGraphics.background(0);
        textGraphics.textFont('Montserrat, Arial, sans-serif');
        textGraphics.textSize(80);
        const measuredWidth = textGraphics.textWidth(text);
        if (measuredWidth > 780) textGraphics.textSize(80 * 780 / measuredWidth);
        textGraphics.fill(255);
        textGraphics.textAlign(CENTER, CENTER);
        textGraphics.text(text, x, y);
        textGraphics.loadPixels();
        offsets = [];
        for (let ty = 40; ty < 160; ty += 3) {
          for (let tx = 0; tx < 800; tx += 3) {
            if (textGraphics.pixels[(ty * 800 + tx) * 4] > 128) {
              offsets.push([tx - x, ty - y]);
            }
          }
        }
        if (glyphCache.size >= 128) glyphCache.delete(glyphCache.keys().next().value);
        glyphCache.set(text, offsets);
      }

      // Generate random position for this text instance
      let randomX = random(width * 0.1, width * 0.9);
      let randomY = random(height * 0.1, height * 0.6);
      
      for (const [dx, dy] of offsets) {
        const particle = new Particle(randomX + dx, randomY + dy);
        particle.speechGroup = speechGroup;
        particles.push(particle);
      }

    } catch (e) {
      console.error('Error creating text particles:', e);
      // Fallback: create some particles at random position even if text rendering fails
      let fallbackX = random(width * 0.2, width * 0.8);
      let fallbackY = random(height * 0.2, height * 0.5);
      for (let i = 0; i < 100; i++) {
        let px = fallbackX + random(-50, 50);
        let py = fallbackY + random(-20, 20);
        const particle = new Particle(px, py);
        particle.speechGroup = speechGroup;
        particles.push(particle);
      }
    }
  }

function mouseDragged() {
  // Prevent adding particles if mouse is outside the canvas
  if (
    mouseX < 0 || mouseX > width ||
    mouseY < 0 || mouseY > height ||
    isNaN(mouseX) || isNaN(mouseY)
  ) return;

  let gridX = floor(mouseX / pixelSize) * pixelSize;
  let gridY = floor(mouseY / pixelSize) * pixelSize;
  for (let i = 0; i < 8; i++) {
    let offsetX = floor(random(-3, 4)) * pixelSize;
    let offsetY = floor(random(-3, 4)) * pixelSize;
    particles.push(new Particle(gridX + offsetX, gridY + offsetY));
  }
}

</script>
</body>
</html>
